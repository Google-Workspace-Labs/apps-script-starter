<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Script Starter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        max-width: 600px;
        width: 100%;
      }

      h1 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 2em;
      }

      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1em;
      }

      .info-box {
        background: #f0f4ff;
        border-left: 4px solid #667eea;
        padding: 20px;
        border-radius: 4px;
        margin: 20px 0;
      }

      .info-box h2 {
        color: #667eea;
        font-size: 1.2em;
        margin-bottom: 10px;
      }

      .info-box p {
        color: #555;
        margin: 5px 0;
      }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        width: 100%;
        margin-top: 10px;
      }

      button:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }

      button:active {
        transform: translateY(0);
      }

      .result {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        font-weight: 500;
      }

      .result.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .result.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .hidden {
        display: none;
      }

      .footer {
        margin-top: 30px;
        text-align: center;
        color: #999;
        font-size: 0.9em;
      }

      code {
        background: #f4f4f4;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        color: #e83e8c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🚀 Apps Script Starter</h1>
      <p class="subtitle">TypeScript + workspace-core 템플릿</p>

      <div class="info-box">
        <h2>✨ 프로젝트 시작 완료!</h2>
        <p>이 템플릿은 다음을 포함합니다:</p>
        <ul style="margin-left: 20px; margin-top: 10px;">
          <li>TypeScript 개발 환경</li>
          <li>workspace-core 라이브러리 연동</li>
          <li>자동 빌드 및 배포</li>
        </ul>
      </div>

      <div class="info-box">
        <h2>📝 다음 단계</h2>
        <p>1. <code>src/Code.ts</code> 파일을 수정하세요</p>
        <p>2. <code>npm run watch</code>로 자동 빌드 시작</p>
        <p>3. <code>npm run push</code>로 Apps Script 배포</p>
      </div>

      <button onclick="testWorkspaceCore()">
        workspace-core 테스트
      </button>

      <div id="result" class="result hidden"></div>

      <div class="footer">
        Made with ❤️ by Google-Workspace-Labs
      </div>
    </div>

    <script>
      function testWorkspaceCore() {
        const resultDiv = document.getElementById('result');
        resultDiv.textContent = '테스트 실행 중...';
        resultDiv.className = 'result';
        resultDiv.classList.remove('hidden');

        google.script.run
          .withSuccessHandler(function(result) {
            resultDiv.textContent = '✅ 성공! Apps Script 로그를 확인하세요.';
            resultDiv.classList.add('success');
          })
          .withFailureHandler(function(error) {
            resultDiv.textContent = '❌ 에러: ' + error.message;
            resultDiv.classList.add('error');
          })
          .exampleFunction();
      }
    </script>
  </body>
</html>
